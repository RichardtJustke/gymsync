# App GymSync da Unika (unika.ketsu.dev). Segredos em "unika-app-secrets", criados pelo deploy.sh.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: unika-postgres-pvc
  namespace: unika
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unika-postgres
  namespace: unika
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: unika-postgres
  template:
    metadata:
      labels:
        app: unika-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: gymsync
            - name: POSTGRES_USER
              value: gymsync
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: unika-app-secrets, key: DB_PASSWORD }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "gymsync", "-d", "gymsync"]
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: unika-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: unika-postgres
  namespace: unika
spec:
  selector:
    app: unika-postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unika-api
  namespace: unika
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unika-api
  template:
    metadata:
      labels:
        app: unika-api
    spec:
      containers:
        - name: api
          image: unika-app/api:latest
          imagePullPolicy: Never
          env:
            - { name: APP_ENV, value: production }
            - { name: PORT, value: "8080" }
            # Ambiente de avaliação da academia: contas de demonstração ligadas
            - { name: SEED_DEMO, value: "true" }
            - { name: ALLOWED_ORIGINS, value: "https://unika.ketsu.dev,https://richardtjustke.github.io,https://localhost,capacitor://localhost" }
            - { name: DB_HOST, value: unika-postgres }
            - { name: DB_USER, value: gymsync }
            - { name: DB_NAME, value: gymsync }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: unika-app-secrets, key: DB_PASSWORD }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: unika-app-secrets, key: JWT_SECRET }
            - name: PAYMENT_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef: { name: unika-app-secrets, key: PAYMENT_WEBHOOK_SECRET }
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: unika-api
  namespace: unika
spec:
  selector:
    app: unika-api
  ports:
    - port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unika-web
  namespace: unika
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unika-web
  template:
    metadata:
      labels:
        app: unika-web
    spec:
      containers:
        - name: web
          image: unika-app/web:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
---
# NodePort: o nginx do host (TLS via certbot) faz proxy de unika.ketsu.dev para 127.0.0.1:30095
apiVersion: v1
kind: Service
metadata:
  name: unika-web
  namespace: unika
spec:
  type: NodePort
  selector:
    app: unika-web
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30095
